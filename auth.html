<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FadeSpace</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #000; color: #F7F4EC; font-family: -apple-system, system-ui, sans-serif; text-align: center; padding: 24px; }
  h1 { font-size: 30px; margin: 0 0 8px; } h1 span { color: #FFC22E; }
  p { color: #A39A86; margin: 0 0 24px; }
  a { display: inline-block; background: #FFC22E; color: #000; font-weight: 800; text-decoration: none;
      padding: 14px 26px; border-radius: 12px; }
</style>
</head>
<body>
<div>
  <h1>Fade<span>Space</span></h1>
  <p>Signing you in…</p>
  <a id="open" href="chairs://auth-callback">Open FadeSpace</a>
</div>
<script>
  // Hands the sign-in straight back to the FadeSpace app. Only app addresses are allowed.
  var to = new URLSearchParams(location.search).get('to') || 'chairs://auth-callback';
  if (!/^(chairs|exp):\/\//.test(to)) to = 'chairs://auth-callback';
  var target = to + (location.hash || '');
  document.getElementById('open').href = target;
  location.replace(target);
</script>
</body>
</html>
